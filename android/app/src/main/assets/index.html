    // ════════════════════════════════════════════════════════════
    //  CARGA DE DATOS
    // ════════════════════════════════════════════════════════════

    async function loadCounts() {
      try {
        // Vía RPC: la pantalla se deduce del token en el servidor, no se manda
        // screen_id desde el cliente. Devuelve las mismas filas de la vista.
        var res = await sb.rpc('player_content_counts', { p_token: lsGet('device_token') })
        var counts     = {}
        var lastPlayed = {}
        if (res.error) {
          dlog('loadCounts error: ' + res.error.message, 'warn')
        } else if (res.data) {
          res.data.forEach(function(row) {
            counts[row.content_id]     = row.total_plays
            lastPlayed[row.content_id] = row.last_played_at ? new Date(row.last_played_at).getTime() : 0
          })
          dlog('loadCounts OK: ' + res.data.length + ' registros', 'ok')
        }
        return { counts: counts, lastPlayed: lastPlayed }
      } catch(e) {
        dlog('loadCounts excepción: ' + e.message, 'err')
        return { counts: {}, lastPlayed: {} }
      }
    }

    // ════════════════════════════════════════════════════════════
    //  PROGRAMACIÓN POR DÍAS Y HORAS
    //  Se evalúa con la hora LOCAL del dispositivo (funciona offline).
    //  schedule_days: array formato Date.getDay() (0=domingo ... 6=sábado)
    //  schedule_start / schedule_end: 'HH:MM' o 'HH:MM:SS'
    //  Sin restricciones => siempre activo (comportamiento por defecto).
    // ════════════════════════════════════════════════════════════

    function parseTimeToMinutes(t) {
      if (!t) return null
      var parts = String(t).split(':')
      if (parts.length < 2) return null
      var h = parseInt(parts[0], 10)
      var m = parseInt(parts[1], 10)
      if (isNaN(h) || isNaN(m)) return null
      return h * 60 + m
    }

    // Un contenido con fecha de vencimiento deja de reproducirse al terminar
    // ese día. La fecha se parsea como fecha LOCAL del dispositivo (no UTC),
    // así "vence hoy" sigue válido hasta las 23:59:59 locales sin adelantarse
    // un día en zonas horarias detrás de UTC (ej. RD, UTC-4).
    function isExpired(item) {
      if (!item || !item.expires_at) return false
      var parts = String(item.expires_at).slice(0, 10).split('-')
      if (parts.length < 3) return false
      var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10) - 1, d = parseInt(parts[2], 10)
      if (isNaN(y) || isNaN(mo) || isNaN(d)) return false
      var expiry = new Date(y, mo, d, 23, 59, 59, 999)
      return new Date() > expiry
    }

    // Un contenido con not_before futuro no se reproduce hasta que llegue ese día.
    // Mismo parseo local que isExpired: not_before = inicio del día local (00:00:00).
    function isNotStarted(item) {
      if (!item || !item.not_before) return false
      var parts = String(item.not_before).slice(0, 10).split('-')
      if (parts.length < 3) return false
      var y = parseInt(parts[0], 10), mo = parseInt(parts[1], 10) - 1, d = parseInt(parts[2], 10)
      if (isNaN(y) || isNaN(mo) || isNaN(d)) return false
      var debut = new Date(y, mo, d, 0, 0, 0, 0)
      return new Date() < debut
    }

    function isWithinSchedule(item) {
      if (!item) return true
      var days  = item.schedule_days
      var start = item.schedule_start
      var end   = item.schedule_end

      var hasDays = days && days.length
      var hasTime = start && end
      if (!hasDays && !hasTime) return true   // sin restricción

      var now = new Date()

      // Días de la semana (hora local del dispositivo)
      if (hasDays && days.indexOf(now.getDay()) === -1) return false

      // Rango horario
      if (hasTime) {
        var s = parseTimeToMinutes(start)
        var e = parseTimeToMinutes(end)
        if (s === null || e === null) return true
        var mins = now.getHours() * 60 + now.getMinutes()
        if (s <= e) {
          // Rango normal dentro del mismo día (ej. 06:00 a 22:00)
          if (mins < s || mins >= e) return false
        } else {
          // Rango que cruza la medianoche (ej. 22:00 a 06:00)
          if (mins < s && mins >= e) return false
        }
      }
      return true
    }

    // ════════════════════════════════════════════════════════════
    //  HORARIO OPERATIVO DE LA PANTALLA
    //  Ventana en que la pantalla reproduce y cuenta estadísticas. Fuera de
    //  ella: pantalla negra limpia y sin registro de reproducciones. Usa la
    //  hora LOCAL del dispositivo, así funciona offline. Soporta cruce de
    //  medianoche (ej. 06:00 a 02:00).
    // ════════════════════════════════════════════════════════════

    var operatingActive = true

    function isWithinOperatingHours() {
      if (!screenData) return true
      var start = screenData.operating_start
      var end   = screenData.operating_end
      if (!start || !end) return true      // sin restricción → siempre activa
      var s = parseTimeToMinutes(start)
      var e = parseTimeToMinutes(end)
      if (s === null || e === null) return true
      if (s === e) return true             // ventana de 24h
      var now  = new Date()
      var mins = now.getHours() * 60 + now.getMinutes()
      if (s < e) return mins >= s && mins < e          // mismo día
      return mins >= s || mins < e                     // cruza medianoche
    }

    function showOffHoursScreen() {
      var el = document.getElementById('offhours')
      if (el) el.style.display = 'block'
    }
    function hideOffHoursScreen() {
      var el = document.getElementById('offhours')
      if (el) el.style.display = 'none'
    }

    // Detiene y limpia toda reproducción (videos/imágenes) de todas las zonas.
    // Incrementa la generación de cada zona para invalidar cualquier cadena
    // pendiente (timeouts/onended): al reanudar con resumeAllZones se arranca
    // una sola cadena limpia por zona, sin riesgo de reproducción doble.
    function stopAllZonesPlayback() {
      Object.keys(zoneStates).forEach(function(zoneId) {
        if (zoneStates[zoneId]) zoneStates[zoneId].gen = (zoneStates[zoneId].gen || 0) + 1
        clearVideoWatchdog(zoneId)
        if (zoneObjectUrls[zoneId]) {
          URL.revokeObjectURL(zoneObjectUrls[zoneId])
          zoneObjectUrls[zoneId] = null
        }
        var zoneEl = document.getElementById('zone-' + zoneId)
        if (zoneEl) zoneEl.innerHTML = ''
      })
    }

    function resumeAllZones() {
      Object.keys(zoneStates).forEach(function(zoneId) {
        if (zoneStates[zoneId] && zoneStates[zoneId].entries.length > 0) playNext(zoneId)
      })
    }

    // Estado inicial (llamado antes del primer playNext para no parpadear).
    function initOperatingState() {
      operatingActive = isWithinOperatingHours()
      if (!operatingActive) {
        showOffHoursScreen()
        dlog('Arranque fuera de horario operativo → pantalla negra', 'warn')
      }
    }

    // Chequeo periódico: solo actúa en las transiciones dentro↔fuera.
    function applyOperatingState() {
      var active = isWithinOperatingHours()
      if (active === operatingActive) return
      operatingActive = active
      if (!active) {
        dlog('Fuera de horario operativo → pantalla negra', 'warn')
        showOffHoursScreen()
        stopAllZonesPlayback()
      } else {
        dlog('Dentro de horario operativo → reanudando reproducción', 'ok')
        hideOffHoursScreen()
        resumeAllZones()
      }
    }

    function startOperatingWatch() {
      setInterval(applyOperatingState, 30000)
    }

    // ════════════════════════════════════════════════════════════
    //  ALGORITMO DE PLAYLIST
    // ════════════════════════════════════════════════════════════

    function getNextItem(zoneId) {
      var state   = zoneStates[zoneId]
      var entries = state.entries
      var opHours = screenData.operating_hours || 20
      var now     = Date.now()
      var total   = entries.length
      if (total === 0) return null

      for (var attempt = 0; attempt < total; attempt++) {
        var idx   = state.currentIndex % total
        state.currentIndex++
        var entry = entries[idx]

        if (entry.kind === 'item') {
          var item = entry.item
          // Vencido o aún no empezado → nunca se reproduce.
          if (isExpired(item)) continue
          if (isNotStarted(item)) continue
          // Fuera de su horario programado → saltar a la siguiente entrada.
          if (!isWithinSchedule(item)) continue
          if (!item.is_unlimited && item.daily_frequency) {
            var played = state.dailyCounts[item.id] || 0
            if (played >= item.daily_frequency) continue
            var intervalMs = (opHours * 3600 * 1000) / item.daily_frequency
            var elapsed    = now - (state.lastPlayedAt[item.id] || 0)
            if (elapsed < intervalMs) continue
          }
          return { item: item, subName: null }
        }

        if (entry.kind === 'sub') {
          var sub      = entry.sub
          var subItems = entry.items
          if (!subItems || subItems.length === 0) continue
          if (!sub.is_unlimited && sub.daily_frequency) {
            var subPlayed   = state.dailyCounts['sub_' + sub.id] || 0
            if (subPlayed >= sub.daily_frequency) continue
            var subInterval = (opHours * 3600 * 1000) / sub.daily_frequency
            var subElapsed  = now - (state.lastPlayedAt['sub_' + sub.id] || 0)
            if (subElapsed < subInterval) continue
          }
          var subItem = subItems[entry.subIndex % subItems.length]
          entry.subIndex++
          // Si el video elegido está vencido, aún no empieza, o fuera de su horario, saltar.
          if (isExpired(subItem)) continue
          if (isNotStarted(subItem)) continue
          if (!isWithinSchedule(subItem)) continue
          return { item: subItem, subName: sub.name }
        }
      }
      return null
    }

    // ════════════════════════════════════════════════════════════
    //  REPRODUCCIÓN — sirve SIEMPRE desde el blob local (IndexedDB).
    //
    //  Regla de egress (una sola descarga por video):
    //    · En caché  → se sirve el blob local (sin red).
    //    · Sin caché + online → UNA descarga vía fetch, se guarda en IDB,
    //      y recién entonces se asigna el blob a video.src. Nunca se hace
    //      streaming directo desde Storage a video.src.
    //    · Sin caché + offline → se salta al siguiente ítem.
    //
    //  Guardia de "generación": cada zona tiene un contador `gen`. Toda
    //  continuación de la cadena (timeouts, onended, watchdog) verifica que
    //  la generación siga vigente. Así una resincronización suave puede
    //  matar cadenas viejas sin recargar la página (evita reproducción doble).
    // ════════════════════════════════════════════════════════════

    function zoneAlive(zoneId, gen) {
      return !!(zoneStates[zoneId] && zoneStates[zoneId].gen === gen)
    }

    // Programa la próxima reproducción solo si la generación sigue vigente.
    function laterPlayNext(zoneId, gen, ms) {
      setTimeout(function() { if (zoneAlive(zoneId, gen)) playNext(zoneId) }, ms)
    }

    async function playNext(zoneId) {
      var state = zoneStates[zoneId]
      if (!state) return               // zona eliminada por una resync
      var gen = state.gen

      // Fuera del horario operativo la cadena se detiene aquí; applyOperatingState
      // la reanuda con resumeAllZones() cuando vuelve a estar dentro de horario.
      if (!operatingActive) return

      var result = getNextItem(zoneId)
      if (!result) {
        // Nada reproducible ahora mismo (todo fuera de horario o con su cuota
        // diaria cumplida). No se congela: espera 60s y reintenta, de modo que
        // cuando se abra la ventana horaria el contenido reanuda solo.
        dlog('Zona ' + zoneId.slice(0,6) + ': sin contenido en horario, reintento en 60s', 'info')
        laterPlayNext(zoneId, gen, 60000)
        return
      }
      var item    = result.item
      var subName = result.subName

      // Los streams tipo URL no se cachean (son contenido en vivo/externo).
      if (item.type === 'url') {
        zoneFailStreak[zoneId] = 0
        renderItem(zoneId, item, subName, item.url || '', gen)
        return
      }

      var publicUrl = item.storage_path ? resolveMediaUrl(item.storage_path) : null
      if (!publicUrl) { laterPlayNext(zoneId, gen, 500); return }

      // 1) ¿Está ya en local (IndexedDB → Cache API)?
      var blob = await mediaGetBlob(publicUrl)
      if (!zoneAlive(zoneId, gen)) return   // una resync ocurrió durante el await

      // 2) No está y hay red: UNA sola descarga → guardar → servir el blob.
      if (!blob && isOnline) {
        dlog('Primera vez sin caché → descargando: ' + item.name, 'info')
        blob = await mediaDownloadAndStore(publicUrl)
        if (!zoneAlive(zoneId, gen)) return
      }

      if (!blob) {
        // Sin local y (offline o la descarga falló): saltar al siguiente.
        dlog('Sin blob local para "' + item.name + '" (offline o descarga falló), saltando', 'warn')
        zoneFailStreak[zoneId] = (zoneFailStreak[zoneId] || 0) + 1
        var wait = zoneFailStreak[zoneId] > 3 ? 5000 : 500
        laterPlayNext(zoneId, gen, wait)
        return
      }

      zoneFailStreak[zoneId] = 0
      renderItem(zoneId, item, subName, URL.createObjectURL(blob), gen)
    }

    function renderItem(zoneId, item, subName, srcUrl, gen) {
      var zoneEl = document.getElementById('zone-' + zoneId)
      if (!zoneEl) { if (srcUrl && srcUrl.indexOf('blob:') === 0) URL.revokeObjectURL(srcUrl); return }

      var state = zoneStates[zoneId]
      if (!state) { if (srcUrl && srcUrl.indexOf('blob:') === 0) URL.revokeObjectURL(srcUrl); return }
      var url   = srcUrl

      state.dailyCounts[item.id]  = (state.dailyCounts[item.id] || 0) + 1
      state.lastPlayedAt[item.id] = Date.now()

      if (subName) {
        state.dailyCounts['sub_' + item.sub_playlist_id]  = (state.dailyCounts['sub_' + item.sub_playlist_id] || 0) + 1
        state.lastPlayedAt['sub_' + item.sub_playlist_id] = Date.now()
      }

      logPlayback(zoneId, item.id)
      persistCountsDebounced(zoneId)

      var isLocal = url && url.indexOf('blob:') === 0
      var label   = subName ? '[' + subName + '] ' + item.name.slice(0, 20) : item.name.slice(0, 28)
      var played  = state.dailyCounts[item.id]
      var cuota   = item.daily_frequency ? item.daily_frequency : '∞'
      log('▶ ' + label + '\n' + played + '/' + cuota + ' reproducciones' + (isLocal ? ' · 💾 local' : ''))
      dlog('Reproduciendo: ' + item.name + ' tipo=' + item.type + (isLocal ? ' (blob local)' : ' (red/externo)'), 'ok')

      // Limpiar el vigilante y la blob URL de la reproducción anterior.
      clearVideoWatchdog(zoneId)
      if (zoneObjectUrls[zoneId]) {
        URL.revokeObjectURL(zoneObjectUrls[zoneId])
        zoneObjectUrls[zoneId] = null
      }
      if (isLocal) zoneObjectUrls[zoneId] = url

      zoneEl.innerHTML = ''

      if (item.type === 'url') {
        var iframe          = document.createElement('iframe')
        iframe.src          = item.url || ''
        iframe.style.width  = '100%'
        iframe.style.height = '100%'
        iframe.style.border = 'none'
        iframe.allow        = 'autoplay; fullscreen; encrypted-media'
        iframe.setAttribute('allowfullscreen', '')
        zoneEl.appendChild(iframe)
        laterPlayNext(zoneId, gen, (item.duration_seconds || 30) * 1000)
      } else if (item.type === 'image') {
        var img     = document.createElement('img')
        img.style.objectFit = (state && state.fitMode) || 'cover'
        img.onload  = function() { laterPlayNext(zoneId, gen, (item.duration_seconds || 10) * 1000) }
        img.onerror = function() {
          dlog('Error cargando imagen: ' + (url || '').slice(0, 60), 'err')
          laterPlayNext(zoneId, gen, 500)
        }
        img.src = url
        zoneEl.appendChild(img)
      } else {
        var video         = document.createElement('video')
        video.muted       = true
        video.autoplay    = true
        video.playsInline = true
        video.style.objectFit = (state && state.fitMode) || 'cover'
        video.setAttribute('webkit-playsinline', '')
        video.setAttribute('disableremoteplayback', '')
        video.onended = function() { clearVideoWatchdog(zoneId); if (zoneAlive(zoneId, gen)) playNext(zoneId) }
        video.onerror = function() {
          dlog('Error reproduciendo video: ' + (url || '').slice(0, 60), 'err')
          clearVideoWatchdog(zoneId)
          laterPlayNext(zoneId, gen, 500)
        }
        video.src = url
        zoneEl.appendChild(video)
        video.play().catch(function(e) {
          dlog('video.play() rechazado: ' + e.message, 'warn')
        })
        armVideoWatchdog(zoneId, video, gen)
      }
    }

    // Vigilante anti-congelamiento: si un video queda "atascado" (el
    // currentTime no avanza) más de 8s mientras debería estar reproduciendo
    // — típico cuando se cae la red a mitad de un stream en vivo — se salta
    // al siguiente ítem en vez de dejar la pantalla congelada.
    function armVideoWatchdog(zoneId, videoEl, gen) {
      clearVideoWatchdog(zoneId)
      var lastTime     = -1
      var stalledSince = null
      zoneWatchdogs[zoneId] = setInterval(function() {
        if (!videoEl || videoEl.ended || videoEl.paused) return
        var t = videoEl.currentTime
        if (t === lastTime) {
          if (stalledSince === null) stalledSince = Date.now()
          else if (Date.now() - stalledSince > 8000) {
            dlog('Video atascado en zona ' + zoneId.slice(0,6) + ' → saltando', 'warn')
            clearVideoWatchdog(zoneId)
            if (zoneAlive(zoneId, gen)) playNext(zoneId)
            return
          }
        } else {
          stalledSince = null
        }
        lastTime = t
      }, 2000)
    }

    function clearVideoWatchdog(zoneId) {
      if (zoneWatchdogs[zoneId]) {
        clearInterval(zoneWatchdogs[zoneId])
        zoneWatchdogs[zoneId] = null
      }
    }

    function logPlayback(zoneId, contentId) {
      // Fuera del horario operativo NO se cuentan estadísticas (ni online ni en
      // el lote, para que no se sincronicen luego).
      if (!isWithinOperatingHours()) return
      // Batching: acumula en memoria (espejado a IndexedDB) — el envío real
      // ocurre en lotes cada 10 min / al volver online / al ocultar la app.
      addToBatch({
        screen_id: screenData.id, zone_id: zoneId, content_id: contentId,
        played_at: new Date().toISOString(),
      })
    }

    // ════════════════════════════════════════════════════════════
    //  LAYOUT
    // ════════════════════════════════════════════════════════════

    // Última estructura renderizada, para que softResync detecte si el layout
    // cambió (zonas añadidas/removidas/movidas/redimensionadas o dimensiones
    // del programa) y decida si reconstruir el DOM o solo refrescar contenido.
    var renderedProgram = null
    var renderedZones   = []

    function buildLayout(program, zones) {
      renderedProgram = { width: program.width, height: program.height }
      renderedZones   = zones.map(function(z) {
        return { id: z.id, x: z.x, y: z.y, width: z.width, height: z.height, background_color: z.background_color || '' }
      })
      screenEl.innerHTML = ''
      var screenW    = window.screen.width
      var screenH    = window.screen.height
      var exactMatch = (screenW === program.width && screenH === program.height)

      var container              = document.createElement('div')
      container.id               = 'program-container'
      container.style.position   = 'absolute'
      container.style.background = '#000'
      container.style.width      = program.width  + 'px'
      container.style.height     = program.height + 'px'

      if (exactMatch) {
        container.style.left      = '0px'
        container.style.top       = '0px'
        container.style.transform = 'none'
        dlog('Layout: modo exacto ' + program.width + '×' + program.height, 'ok')
      } else {
        var scale   = Math.min(window.innerWidth / program.width, window.innerHeight / program.height)
        var offsetX = (window.innerWidth  - program.width  * scale) / 2
        var offsetY = (window.innerHeight - program.height * scale) / 2
        container.style.left            = offsetX + 'px'
        container.style.top             = offsetY + 'px'
        container.style.transformOrigin = 'top left'
        container.style.transform       = 'scale(' + scale + ')'
        dlog('Layout: escala ' + scale.toFixed(3) + ' (pantalla ' + screenW + '×' + screenH + ' vs ' + program.width + '×' + program.height + ')', 'ok')
      }

      for (var i = 0; i < zones.length; i++) {
        var zone             = zones[i]
        var div              = document.createElement('div')
        div.className        = 'zone'
        div.id               = 'zone-' + zone.id
        div.style.left       = zone.x      + 'px'
        div.style.top        = zone.y      + 'px'
        div.style.width      = zone.width  + 'px'
        div.style.height     = zone.height + 'px'
        div.style.background = zone.background_color || '#000'
        container.appendChild(div)
      }
      screenEl.appendChild(container)
      dlog('Zonas creadas: ' + zones.length, 'ok')
    }

    // ════════════════════════════════════════════════════════════
    //  HEARTBEAT
    // ════════════════════════════════════════════════════════════

    function startHeartbeat() {
      function beat() {
        if (!sb || !screenData) return
        // La RPC devuelve si seguimos siendo dueños, así que se conserva el
        // piggyback de antes: la detección de despareo no cuesta una petición
        // extra. app_version viaja aquí para poder comprobar, antes de cerrar
        // las tablas al rol anónimo, que no queda ninguna TV con bundle viejo.
        sb.rpc('player_heartbeat', {
          p_token: lsGet('device_token'),
          p_app_version: APP_VERSION,
          p_session: lsGet('device_id')
        }).then(function(res) {
          if (res.error) { dlog('Heartbeat error: ' + res.error.message, 'warn'); return }
          dlog('Heartbeat OK', 'ok')
          if (res.data) checkDeviceStillOwner(res.data.owner === true)
        })
      }
      beat()
      setInterval(beat, 30000)
    }

    // ════════════════════════════════════════════════════════════
    //  POLLING
    // ════════════════════════════════════════════════════════════

    function startPolling() {
      setInterval(async function() {
        if (!sb || !screenData || !screenData.current_program_id) return
        try {
          // Una sola llamada cubre publicación y ajustes de pantalla: antes
          // eran dos peticiones por ciclo (programs + screens).
          // SIN p_session a propósito: este poll es de LECTURA y no debe
          // reclamar la pantalla. De la propiedad se ocupa el heartbeat, que
          // ya devuelve `owner`.
          var res = await sb.rpc('get_player_payload', { p_token: lsGet('device_token') })
          if (res.error) throw new Error(res.error.message)

          var p = res.data
          if (!p) throw new Error('Respuesta vacía del servidor')
          if (p.status !== 'playing') {
            // 'released' / 'invalid' / 'no-program' se atienden en el bloque de
            // release. Aquí solo se deja constancia para no fallar en silencio.
            dlog('Poll: estado ' + p.status, 'warn')
            return
          }

          if (!isOnline) {
            setConnStatus(true)
            dlog('Reconectado — recargando conteos...', 'ok')
            var saved = await loadCounts()
            Object.keys(zoneStates).forEach(function(zoneId) {
              Object.keys(saved.counts).forEach(function(contentId) {
                var current = zoneStates[zoneId].dailyCounts[contentId] || 0
                if (saved.counts[contentId] > current) {
                  zoneStates[zoneId].dailyCounts[contentId]  = saved.counts[contentId]
                  zoneStates[zoneId].lastPlayedAt[contentId] = saved.lastPlayed[contentId] || 0
                }
              })
              persistCountsDebounced(zoneId)
            })
          }

          if (p.program) {
            var latest = p.program.published_at
            if (lastPublishedAt === null) { lastPublishedAt = latest }
            else if (latest && latest !== lastPublishedAt) {
              dlog('Nueva publicación detectada → resync suave', 'ok')
              await softResync()
              return
            }
          }

          // Los cambios de la pantalla (horario operativo, reset) viajan en el
          // mismo payload y se aplican en caliente, sin recargar ni requerir
          // re-publicar la zona.
          await checkScreenSettingsChange(p.screen)
        } catch(e) {
          if (isOnline) {
            setConnStatus(false)
            dlog('Polling falló: ' + e.message, 'err')
          }
        }
      }, 15000)
    }

    // Aplica en caliente el horario operativo y el flag de reset. Los datos
    // llegan ya resueltos en el payload del poll: esta función no consulta.
    //
    // El try/catch no es decorativo: antes el fallo se tragaba el segundo
    // callback del .then(). Sin él, una excepción de softResync() subiría al
    // catch del poll y marcaría el player como desconectado sin estarlo.
    async function checkScreenSettingsChange(scr) {
      if (!scr) return
      try {
        // ── Horario operativo ─────────────────────────────────
        var newStart = scr.operating_start || null
        var newEnd   = scr.operating_end   || null
        var curStart = screenData.operating_start || null
        var curEnd   = screenData.operating_end   || null
        if (newStart !== curStart || newEnd !== curEnd) {
          dlog('Horario operativo actualizado: ' +
               (newStart || '—') + ' a ' + (newEnd || '—') + ' → aplicando', 'ok')
          screenData.operating_start = newStart
          screenData.operating_end   = newEnd
          if (scr.operating_hours != null) screenData.operating_hours = scr.operating_hours
          persistScreenMeta()
          applyOperatingState()
        }

        // ── Reset remoto ──────────────────────────────────────
        // La conectividad ya quedó probada por el get_player_payload del poll,
        // un paso antes: no hace falta probeConn().
        var resetAt = scr.reset_requested_at || null
        if (resetAt && new Date(resetAt) > new Date(playerBootedAt)) {
          dlog('Reset remoto detectado → ejecutando resync suave', 'ok')
          sb.rpc('player_ack_reset', { p_token: lsGet('device_token') })
          if (!isOnline) setConnStatus(true)
          await softResync()
        }
      } catch(e) { /* fallo silencioso: se reintenta en el próximo ciclo */ }
    }

    // ════════════════════════════════════════════════════════════
    //  REALTIME (con fallback silencioso si falla)
    // ════════════════════════════════════════════════════════════

    function subscribeToChanges() {
      try {
        sb.channel('player-' + screenData.id)
          .on('postgres_changes', {
            event: 'UPDATE', schema: 'public', table: 'programs',
            filter: 'id=eq.' + screenData.current_program_id
          }, function() {
            dlog('Realtime: cambio detectado → resync suave', 'ok')
            softResync()
          })
          .subscribe(function(status) {
            dlog('Realtime status: ' + status, status === 'SUBSCRIBED' ? 'ok' : 'warn')
          })
      } catch(e) {
        dlog('Realtime no disponible: ' + e.message + ' (polling activo como respaldo)', 'warn')
      }
    }

    // ════════════════════════════════════════════════════════════
    //  CONEXIÓN
    // ════════════════════════════════════════════════════════════

    // Verificación real de conectividad: HEAD a Supabase (5 s de timeout).
    // navigator.onLine miente en Android WebView; este probe no.
    function probeConn() {
      return new Promise(function(resolve) {
        var done = false
        function finish(v) { if (!done) { done = true; resolve(v) } }
        var xhr = new XMLHttpRequest()
        xhr.open('HEAD', SUPABASE_URL, true)
        xhr.timeout = 5000
        xhr.onload  = function() { finish(true) }
        xhr.onerror = function() { finish(false) }
        xhr.ontimeout = function() { finish(false) }
        try { xhr.send() } catch(_) { finish(false) }
        setTimeout(function() { finish(false) }, 5500)
      })
    }

    function watchConnection() {
      window.addEventListener('online',  function() {
        dlog('Evento: online', 'ok')
        probeConn().then(function(ok) { if (ok) setConnStatus(true) })
      })
      window.addEventListener('offline', function() { setConnStatus(false); dlog('Evento: offline', 'err') })
      // Arranque: verificación real en vez de navigator.onLine
      probeConn().then(function(ok) { setConnStatus(ok) })
    }

    // ════════════════════════════════════════════════════════════
    //  CARGA DE PROGRAMA
    //  Intenta cargar en vivo desde Supabase; si falla o no hay
    //  conexión, usa el último snapshot guardado en IndexedDB para
    //  seguir reproduciendo sin interrupción.
    // ════════════════════════════════════════════════════════════

    // Construye las entradas (items directos + sub-playlists ordenadas) de una
    // zona. Ya no consulta: los datos vienen resueltos dentro del payload de
    // get_player_payload. Antes eran 1 + 2N + M peticiones por recarga.
    function buildZoneEntries(pz) {
      var directEntries = (pz.items || []).map(function(item) {
        return { kind: 'item', item: item, sort_order: item.sort_order }
      })
      var subEntries = (pz.subs || []).map(function(sub) {
        // `sub` conserva la forma de antes (id, name, sort_order,
        // daily_frequency, is_unlimited) porque el tope diario los usa.
        return { kind: 'sub', sub: sub, items: sub.items || [], subIndex: 0, sort_order: sub.sort_order }
      })
      var combined = directEntries.concat(subEntries)
      combined.sort(function(a, b) { return a.sort_order - b.sort_order })
      return combined
    }

    // Trae en vivo el programa, sus zonas, contadores y entradas de cada zona.
    // Lanza excepción si algo falla. Reutilizado por loadProgram (arranque) y
    // softResync (recarga suave sin reload).
    //
    // Una sola llamada en vez de la cascada de antes. El token es la
    // credencial: la RPC solo devuelve lo de ESTA pantalla, así que el player
    // dejará de necesitar permiso de lectura sobre las tablas.
    async function fetchProgramData() {
      var token = lsGet('device_token')
      // getDeviceId() devuelve una Promise (calcula y cachea la huella), hay
      // que resolverla: pasarla tal cual serializaría {} como sesión.
      var deviceId = await getDeviceId()
      var res = await sb.rpc('get_player_payload', {
        p_token: token,
        p_session: deviceId,
        p_had_claim: deviceLockClaimed,
        p_claimed_at: lsGet('claimed_at') || null
      })
      if (res.error) throw new Error(res.error.message)

      var p = res.data
      if (!p) throw new Error('Respuesta vacía del servidor')
      // Los estados de propiedad (invalid/released/taken/locked) los resuelve
      // quien llama; aquí solo interesa que haya contenido que montar.
      if (p.status !== 'playing') throw new Error('Estado del player: ' + p.status)
      if (!p.program) throw new Error('La pantalla no tiene programa asignado')

      var program = p.program
      var pzones  = p.zones || []
      var zones   = pzones   // mismas claves que antes (id, x, y, width, height, ...)

      var remoteCounts = await loadCounts()

      var zoneEntriesMap = {}
      for (var i = 0; i < pzones.length; i++) {
        zoneEntriesMap[pzones[i].id] = buildZoneEntries(pzones[i])
        dlog('Zona ' + pzones[i].id.slice(0,8) + ': ' + zoneEntriesMap[pzones[i].id].length + ' entradas', 'ok')
      }
      return { program: program, zones: zones, zoneEntriesMap: zoneEntriesMap, remoteCounts: remoteCounts }
    }

    async function loadProgram() {
      if (!screenData.current_program_id) {
        dlog('Sin programa asignado a esta pantalla', 'warn')
        log('⚠ Sin programa asignado')
        return
      }

      log('Cargando programa...')

      var program        = null
      var zones           = []
      var zoneEntriesMap  = {}
      var onlineLoadOk    = false
      var remoteCounts    = { counts: {}, lastPlayed: {} }

      if (isOnline) {
        try {
          log('Cargando historial de reproducciones...')
          var data = await fetchProgramData()
          program        = data.program
          zones          = data.zones
          zoneEntriesMap = data.zoneEntriesMap
          remoteCounts   = data.remoteCounts
          dlog('Programa OK: ' + program.name, 'ok')

          if (!zones.length) {
            dlog('El programa no tiene zonas configuradas', 'warn')
            log('⚠ Sin zonas')
            return
          }
          dlog('Zonas cargadas: ' + zones.length, 'ok')

          lastPublishedAt = program.published_at || program.updated_at
          onlineLoadOk    = true
          persistSnapshot(program, zones, zoneEntriesMap)
        } catch(e) {
          dlog('Carga online falló (' + e.message + ') → usando snapshot local', 'warn')
          onlineLoadOk = false
        }
      }

      if (!onlineLoadOk) {
        log('Sin conexión · cargando última lista guardada...')
        var metaRow = await idbGet('meta', 'state').catch(function() { return null })
        if (!metaRow || metaRow.screenId !== screenData.id || !metaRow.program) {
          log('⚠ Sin lista guardada — esperando conexión')
          dlog('No hay snapshot local utilizable para esta pantalla', 'err')
          setTimeout(loadProgram, 5000)
          return
        }
        var zoneRows = await idbGetAll('zones').catch(function() { return [] })
        if (!zoneRows.length) {
          log('⚠ Snapshot sin zonas — esperando conexión')
          setTimeout(loadProgram, 5000)
          return
        }
        program         = metaRow.program
        lastPublishedAt = metaRow.publishedAt
        zones           = zoneRows.map(function(r) { return r.zone })
        zoneRows.forEach(function(r) { zoneEntriesMap[r.zoneId] = r.entries })
        dlog('Snapshot local cargado: ' + zones.length + ' zona(s) (modo offline)', 'ok')
      }

      var localCountsRows = await idbGetAll('counts').catch(function() { return [] })
      var localCountsMap  = {}
      localCountsRows.forEach(function(r) { localCountsMap[r.zoneId] = r })

      zones.forEach(function(zone) {
        var lc = localCountsMap[zone.id]
        zoneStates[zone.id] = {
          entries:      zoneEntriesMap[zone.id] || [],
          dailyCounts:  Object.assign({}, lc ? lc.dailyCounts  : {}, remoteCounts.counts),
          lastPlayedAt: Object.assign({}, lc ? lc.lastPlayedAt : {}, remoteCounts.lastPlayed),
          currentIndex: 0,
          startTime:    Date.now(),
          fitMode:      zone.fit_mode || 'cover',
          gen:          0,
        }
      })

      buildLayout(program, zones)

      if (onlineLoadOk) enqueueAllMedia(zoneEntriesMap)

      for (var k = 0; k < zones.length; k++) {
        (function(zoneId, delay) {
          setTimeout(function() {
            if (zoneStates[zoneId].entries.length > 0) {
              playNext(zoneId)
            } else {
              dlog('Zona ' + zoneId.slice(0,8) + ' sin contenido — sin reproducción', 'warn')
            }
          }, delay)
        })(zones[k].id, k * 300)
      }

      log('▶ ' + program.name + ' · ' + zones.length + ' zona(s) · ' + (screenData.operating_hours || 20) + 'h/día' + (onlineLoadOk ? '' : ' · modo offline'))
      dlog('Player iniciado: ' + program.name + (onlineLoadOk ? '' : ' (desde snapshot local)'), 'ok')

      // Ya hay contenido en pantalla: oculta indicadores de estado/conexión.
      document.body.classList.remove('booting')
    }

    // ════════════════════════════════════════════════════════════
    //  RESINCRONIZACIÓN SUAVE (sin window.location.reload)
    //
    //  Al detectar una nueva publicación, en vez de recargar toda la página
    //  (lo que re-descargaba TODA la biblioteca), se refresca la playlist en
    //  caliente:
    //    · Se descargan SOLO los videos nuevos (los ya cacheados no se tocan).
    //    · Se purga del caché solo lo que ya no está en la playlist.
    //    · Si el layout no cambió, las zonas siguen reproduciendo sin corte y
    //      toman el contenido nuevo en su próxima transición natural.
    //    · Si el layout cambió, se reconstruye el DOM y se reinician las
    //      cadenas (la generación mata las viejas para evitar doble reproducción).
    // ════════════════════════════════════════════════════════════

    var resyncing = false

    // ¿Cambió la estructura visual respecto a lo último renderizado?
    function layoutChanged(program, newZones) {
      if (!renderedProgram) return true
      if (renderedProgram.width !== program.width || renderedProgram.height !== program.height) return true
      if (renderedZones.length !== newZones.length) return true
      var byId = {}
      renderedZones.forEach(function(z) { byId[z.id] = z })
      for (var i = 0; i < newZones.length; i++) {
        var n = newZones[i], o = byId[n.id]
        if (!o) return true
        if (o.x !== n.x || o.y !== n.y || o.width !== n.width || o.height !== n.height) return true
        if ((o.background_color || '') !== (n.background_color || '')) return true
      }
      return false
    }

    async function softResync() {
      if (resyncing) return
      if (!isOnline || !sb || !screenData || !screenData.current_program_id) return
      resyncing = true
      try {
        var data
        try {
          data = await fetchProgramData()
        } catch (e) {
          dlog('Resync falló (' + e.message + '), se reintentará en el próximo ciclo', 'warn')
          return
        }
        if (!data.zones.length) { dlog('Resync: programa sin zonas, ignorado', 'warn'); return }

        var program        = data.program
        var newZones       = data.zones
        var zoneEntriesMap = data.zoneEntriesMap

        lastPublishedAt = program.published_at || program.updated_at
        persistSnapshot(program, newZones, zoneEntriesMap)

        var changed = layoutChanged(program, newZones)
        dlog('Resync suave: ' + (changed ? 'layout cambió → reconstruyendo DOM' : 'solo contenido → sin cortar reproducción'), 'ok')
        log('🔄 Actualizando contenido...')

        // Si el layout cambia, invalidar las cadenas actuales (nueva generación)
        // y limpiar sus recursos antes de reconstruir.
        if (changed) {
          Object.keys(zoneStates).forEach(function(zid) {
            zoneStates[zid].gen = (zoneStates[zid].gen || 0) + 1
            clearVideoWatchdog(zid)
            if (zoneObjectUrls[zid]) { URL.revokeObjectURL(zoneObjectUrls[zid]); zoneObjectUrls[zid] = null }
          })
        }

        // Crear/actualizar estados de zona preservando contadores del día.
        var newIds = {}
        newZones.forEach(function(zone) {
          newIds[zone.id] = true
          var prev = zoneStates[zone.id]
          zoneStates[zone.id] = {
            entries:      zoneEntriesMap[zone.id] || [],
            dailyCounts:  prev ? prev.dailyCounts  : Object.assign({}, data.remoteCounts.counts),
            lastPlayedAt: prev ? prev.lastPlayedAt : Object.assign({}, data.remoteCounts.lastPlayed),
            currentIndex: prev ? prev.currentIndex : 0,
            startTime:    prev ? prev.startTime : Date.now(),
            fitMode:      zone.fit_mode || 'cover',
            gen:          prev ? prev.gen : 0,   // ya incrementado arriba si changed
          }
        })

        // Eliminar zonas que ya no existen (matar sus cadenas + limpiar).
        Object.keys(zoneStates).forEach(function(zid) {
          if (!newIds[zid]) {
            zoneStates[zid].gen = (zoneStates[zid].gen || 0) + 1
            clearVideoWatchdog(zid)
            if (zoneObjectUrls[zid]) { URL.revokeObjectURL(zoneObjectUrls[zid]); zoneObjectUrls[zid] = null }
            delete zoneStates[zid]
          }
        })

        // Descargar SOLO lo nuevo y purgar del caché lo que ya no se use.
        enqueueAllMedia(zoneEntriesMap)

        if (changed) {
          buildLayout(program, newZones)
          // Arrancar cadenas nuevas (una por zona) con la generación vigente.
          newZones.forEach(function(zone, idx) {
            (function(zoneId, delay) {
              setTimeout(function() {
                if (operatingActive && zoneStates[zoneId] && zoneStates[zoneId].entries.length > 0) playNext(zoneId)
              }, delay)
            })(zone.id, idx * 300)
          })
        }
        // Si NO cambió el layout: las cadenas existentes siguen vivas y toman
        // las nuevas entries en su próximo getNextItem. No arrancamos nada
        // nuevo → sin reproducción doble.

        log('▶ ' + program.name + ' · ' + newZones.length + ' zona(s)')
      } finally {
        resyncing = false
      }
    }

    // ════════════════════════════════════════════════════════════
    //  INICIO DEL PLAYER
    // ════════════════════════════════════════════════════════════

    // Arranque offline: reconstruye screenData desde el snapshot local para
    // poder reproducir el contenido ya cacheado sin conexión. Devuelve true
    // si había snapshot utilizable para este token.
    async function startPlayerFromSnapshot(token) {
      var metaRow = await idbGet('meta', 'state').catch(function() { return null })
      if (!metaRow || !metaRow.screenId) return false
      // El snapshot es de esta pantalla solo si el token coincide (o si es de
      // una versión antigua que no lo guardaba: se acepta por compatibilidad).
      if (metaRow.deviceToken && metaRow.deviceToken !== token) return false

      screenData = {
        id: metaRow.screenId,
        name: metaRow.screenName || 'Pantalla',
        current_program_id: (metaRow.program && metaRow.program.id) || null,
        operating_hours: metaRow.operating_hours || 20,
        operating_start: metaRow.operating_start || null,
        operating_end:   metaRow.operating_end   || null,
        device_fingerprint: null,
      }
      dlog('Arranque OFFLINE desde snapshot: ' + screenData.name, 'warn')
      log('📴 Sin conexión · reproduciendo contenido guardado')
      return true
    }

    async function startPlayer(token) {
      log('Identificando pantalla...')
      dlog('Buscando pantalla con token: ' + token.slice(0,12) + '...', 'info')

      // La huella va PRIMERO porque viaja en la propia llamada. Si no se
      // puede calcular se sigue adelante con deviceId null: la RPC no reclama
      // la pantalla, no puede devolver locked/taken, y abajo NO se marca
      // deviceLockClaimed. Fail-open: el locking es una barrera, no una
      // cárcel, y sin ese flag el despareo remoto tampoco actúa.
      var deviceId = null
      try {
        deviceId = await getDeviceId()
      } catch (e) {
        dlog('No se pudo calcular fingerprint: ' + e.message + ' → sin device locking', 'warn')
      }

      // UNA sola llamada resuelve identidad, propiedad y contenido.
      var res = await sb.rpc('get_player_payload', {
        p_token: token,
        p_session: deviceId,
        p_had_claim: deviceLockClaimed,
        p_claimed_at: lsGet('claimed_at') || null
      })

      // ── SIN RED vs TOKEN MUERTO ──────────────────────────────────────
      // El cliente REST ya los separa estructuralmente: un fallo de red o un
      // HTTP no-2xx llegan como res.error, mientras que PostgREST responde 200
      // con el payload aunque el token no exista. Antes esto se deducía
      // husmeando el texto del error (PGRST116 / 'not found'), que se rompería
      // solo con que Supabase cambiara el mensaje.
      //
      // Un 2xx con cuerpo vacío tampoco confirma nada: se trata como offline.
      // Un fallo de red NUNCA debe borrar el token ni mandar al QR (bug de
      // julio: tras un corte de luz el player pedía re-vincular en vez de
      // reanudar lo cacheado).
      if (res.error || !res.data) {
        // Sin respuesta utilizable del servidor: arrancar con el snapshot.
        var ok = await startPlayerFromSnapshot(token)
        if (!ok) {
          // Nunca se sincronizó esta pantalla en este equipo: no hay nada que
          // reproducir. Se conserva el token y se reintenta solo.
          dlog('Sin conexión y sin snapshot local → reintentando en 10s', 'err')
          log('📴 Sin conexión · esperando red...')
          setTimeout(function() { startPlayer(token) }, 10000)
          return
        }
        setConnStatus(false)
        watchConnection()
        startEventSync()
        initOperatingState()
        await loadProgram()      // usa el snapshot y el caché de videos
        startOperatingWatch()
        // Al recuperar la red, el propio watchConnection dispara la
        // sincronización; recargamos para validar y retomar el ciclo normal.
        window.addEventListener('online', function onBack() {
          window.removeEventListener('online', onBack)
          dlog('Conexión recuperada tras arranque offline → revalidando', 'ok')
          setTimeout(function() { location.reload() }, 2000)
        })
        return
      }

      var p = res.data

      // ── Este equipo ya no está asignado a la pantalla ────────────────
      // 'invalid' = el token no existe; 'released' = se liberó desde el panel,
      // incluso estando este equipo apagado (p_claimed_at persiste en
      // localStorage). En ambos se olvida el token y se vuelve al QR.
      if (p.status === 'invalid' || p.status === 'released') {
        dlog('El servidor confirma que esta pantalla ya no es nuestra (' + p.status + ')', 'err')
        log(p.status === 'released' ? '🔓 Pantalla liberada · vuelve a vincular'
                                    : '❌ Pantalla no encontrada · vuelve a vincular')
        lsDel('device_token')
        lsDel('claimed_at')
        setTimeout(function() { location.reload() }, 1500)
        return
      }

      // ── Otro equipo la tiene ─────────────────────────────────────────
      // Se CONSERVA el token: puede ser un relevo temporal y así se recupera
      // sin re-vincular a mano.
      var allowed = (p.status !== 'locked' && p.status !== 'taken')
      if (allowed && deviceId) {
        // Propiedad concedida por el servidor. Sin deviceId NO se marca, para
        // no activar el despareo remoto sin ser dueño confirmado.
        if (!deviceLockClaimed) lsSet('claimed_at', new Date().toISOString())
        deviceLockClaimed = true
      }

      screenData = {
        id: p.screen.id,
        name: p.screen.name,
        current_program_id: p.screen.current_program_id,
        operating_hours: p.screen.operating_hours,
        operating_start: p.screen.operating_start,
        operating_end: p.screen.operating_end,
        device_fingerprint: deviceId
      }
      dlog('Pantalla identificada: ' + screenData.name + ' (id=' + screenData.id.slice(0,8) + ')', 'ok')
      log('✓ ' + screenData.name)

      if (!allowed) {
        dlog('Acceso bloqueado: token activo en otro dispositivo', 'err')
        showDeviceLockScreen()
        return   // no reproducir, no seguir intentando
      }

      watchConnection()
      startHeartbeat()
      // last_seen_at lo refresca el heartbeat (ver player_heartbeat).
      startPolling()
      subscribeToChanges()
      startEventSync()
      initOperatingState()   // define operatingActive + pantalla negra si aplica
      await loadProgram()    // el primer playNext ya respeta operatingActive
      startOperatingWatch()  // vigila la ventana horaria cada 30s
    }

    // ── Despareo remoto ("Liberar dispositivo" desde el panel) ─────
    // deviceLockClaimed: true solo cuando este equipo confirmó ser el dueño
    // del token (reclamó la pantalla o su huella coincide). Sin este flag,
    // un fail-open (huella no registrada por red/RLS) se desparearía en
    // bucle al ver NULL en la base.
    var deviceLockClaimed = false
    var unpairing         = false

    // Llamado desde el heartbeat (piggyback en la respuesta que YA llega:
    // cero requests extra). Si el panel liberó la pantalla (huella NULL) u
    // otro equipo la reclamó (huella distinta), este player se desparea:
    // detiene todo, borra el token local y reinicia hacia la pantalla de
    // vinculación (QR). El reload es un evento único disparado por acción
    // del admin — mismo camino que el botón manual "cambiar pantalla" — y
    // con el caché en IndexedDB no re-descarga ningún video.
    // Recibe un booleano calculado en el servidor (antes comparaba la huella
    // aquí). No se trae el fingerprint ajeno: quien tiene el token está
    // autorizado sobre la pantalla, pero no necesita saber qué equipo se la
    // quedó.
    function checkDeviceStillOwner(isOwner) {
      if (!deviceLockClaimed || unpairing) return
      if (!lsGet('device_id')) return
      if (isOwner) return                     // seguimos siendo los dueños
      unpairing = true
      dlog('Dispositivo liberado desde el panel → volviendo a vinculación', 'warn')
      log('🔓 Pantalla liberada · re-vinculación...')
      stopAllZonesPlayback()
      lsDel('device_token')
      lsDel('claimed_at')
      setTimeout(function() { location.reload() }, 800)
    }

    // Devuelve true si este dispositivo puede usar el token, false si está
    // bloqueado. Reclama la pantalla si aún no tiene dueño.
    async function enforceDeviceLock() {
      var deviceId
      try {
        deviceId = await getDeviceId()
      } catch (e) {
        // Sin fingerprint no arriesgamos a bloquear un equipo legítimo: se
        // permite (fail-open). El locking es una barrera, no una cárcel.
        dlog('No se pudo calcular fingerprint: ' + e.message + ' → acceso permitido', 'warn')
        return true
      }

      // La decisión la toma el SERVIDOR: antes se comparaba aquí la huella
      // leída de screens, una columna que cualquier anónimo podía escribir.
      // p_claimed_at permite detectar una liberación ocurrida mientras este
      // equipo estaba apagado, que es el caso de "liberar para mover la
      // pantalla a otro local".
      var res = await sb.rpc('get_player_payload', {
        p_token: lsGet('device_token'),
        p_session: deviceId,
        p_had_claim: deviceLockClaimed,
        p_claimed_at: lsGet('claimed_at') || null
      })

      if (res.error || !res.data) {
        // Fail-open: si no se pudo verificar (RLS/red), se permite reproducir
        // para no dejar la pantalla muerta; el próximo arranque reintentará.
        // OJO: deviceLockClaimed queda en false → el despareo remoto no actúa
        // (evita desparearse en bucle sin ser dueño confirmado).
        var em = res.error ? res.error.message : 'respuesta vacía'
        dlog('No se pudo verificar la propiedad: ' + em + ' → acceso permitido', 'warn')
        return true
      }

      var st = res.data.status

      if (st === 'released' || st === 'invalid') {
        // Este dispositivo dejó de estar asignado a la pantalla: se olvida el
        // token y se vuelve al QR para poder instalarla en otro sitio.
        dlog('Pantalla liberada (' + st + ') → volviendo a vinculación', 'warn')
        log('🔓 Pantalla liberada · re-vinculación...')
        unpairing = true
        stopAllZonesPlayback && stopAllZonesPlayback()
        lsDel('device_token')
        lsDel('claimed_at')
        setTimeout(function() { location.reload() }, 800)
        return false
      }

      if (st === 'taken' || st === 'locked') {
        // Otro equipo tiene la pantalla. NO se borra el token: puede ser un
        // relevo temporal y así se recupera sin re-vincular a mano.
        dlog('La pantalla la tiene otro equipo (' + st + ')', 'warn')
        return false
      }

      // playing / no-program: el servidor nos concedió la propiedad.
      if (!deviceLockClaimed) lsSet('claimed_at', new Date().toISOString())
      deviceLockClaimed = true
      screenData.device_fingerprint = deviceId
      dlog('Propiedad confirmada por el servidor → acceso permitido', 'ok')
      return true
    }

    // startDeviceSeenWatch se eliminó: last_seen_at lo refresca ahora
    // player_heartbeat (cada 30 s, holgado dentro de la ventana de 90 s), y
    // solo cuando quien late es realmente el dueño de la pantalla.

    // ════════════════════════════════════════════════════════════
    //  ARRANQUE
    // ════════════════════════════════════════════════════════════

    // Vars de vinculación QR. Se declaran aquí, dentro del bloque ARRANQUE
    // propio de Android (el que scripts/sync-player-android.cjs PRESERVA),
    // para que la sincronización desde el web player no las elimine. Sin
    // esta declaración, PAIR_BASE_URL queda indefinida y startQRPairing()
    // lanza ReferenceError → el QR se atasca en "Generando QR...".
    var qrCode        = null
    var qrInterval    = null
    var PAIR_BASE_URL = 'https://gestorplayer.vercel.app'

    async function init() {
      runEnvCheck()
      initAfterLib()
    }

    // ════════════════════════════════════════════════════════════
    //  CONEXIÓN POR QR
    // ════════════════════════════════════════════════════════════

    //  devuelve un GIF base64, sin canvas ni Blob: apto para WebView antiguo.
    //

    var qrcode = function() {

      // qrcode
      //---------------------------------------------------------------------

      /**
       * qrcode
       * @param typeNumber 1 to 40
       * @param errorCorrectionLevel 'L','M','Q','H'
       */
      var qrcode = function(typeNumber, errorCorrectionLevel) {

        var PAD0 = 0xEC;
        var PAD1 = 0x11;

        var _typeNumber = typeNumber;
        var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
        var _modules = null;
        var _moduleCount = 0;
        var _dataCache = null;
        var _dataList = [];

        var _this = {};

        var makeImpl = function(test, maskPattern) {

          _moduleCount = _typeNumber * 4 + 17;
          _modules = function(moduleCount) {
            var modules = new Array(moduleCount);
            for (var row = 0; row < moduleCount; row += 1) {
              modules[row] = new Array(moduleCount);
              for (var col = 0; col < moduleCount; col += 1) {
                modules[row][col] = null;
              }
            }
            return modules;
          }(_moduleCount);

          setupPositionProbePattern(0, 0);
          setupPositionProbePattern(_moduleCount - 7, 0);
          setupPositionProbePattern(0, _moduleCount - 7);
          setupPositionAdjustPattern();
          setupTimingPattern();
          setupTypeInfo(test, maskPattern);

          if (_typeNumber >= 7) {
            setupTypeNumber(test);
          }

          if (_dataCache == null) {
            _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
          }

          mapData(_dataCache, maskPattern);
        };

        var setupPositionProbePattern = function(row, col) {

          for (var r = -1; r <= 7; r += 1) {

            if (row + r <= -1 || _moduleCount <= row + r) continue;

            for (var c = -1; c <= 7; c += 1) {

              if (col + c <= -1 || _moduleCount <= col + c) continue;

              if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
                  || (0 <= c && c <= 6 && (r == 0 || r == 6) )
                  || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        };

        var getBestMaskPattern = function() {

          var minLostPoint = 0;
          var pattern = 0;

          for (var i = 0; i < 8; i += 1) {

            makeImpl(true, i);

            var lostPoint = QRUtil.getLostPoint(_this);

            if (i == 0 || minLostPoint > lostPoint) {
              minLostPoint = lostPoint;

          for (var r = 8; r < _moduleCount - 8; r += 1) {
            if (_modules[r][6] != null) {

            _modules[r][6] = (r % 2 == 0);

          for (var c = 8; c < _moduleCount - 8; c += 1) {
            if (_modules[6][c] != null) {

            }
            _modules[6][c] = (c % 2 == 0);
          }
        };

        var setupPositionAdjustPattern = function() {

          var pos = QRUtil.getPatternPosition(_typeNumber);

          for (var i = 0; i < pos.length; i += 1) {

            for (var j = 0; j < pos.length; j += 1) {

              var row = pos[i];
              var col = pos[j];

              if (_modules[row][col] != null) {
                continue;
              }

              for (var r = -2; r <= 2; r += 1) {

                for (var c = -2; c <= 2; c += 1) {

                  if (r == -2 || r == 2 || c == -2 || c == 2
                      || (r == 0 && c == 0) ) {
                    _modules[row + r][col + c] = true;
                  } else {
                    _modules[row + r][col + c] = false;
                  }
                }

          }
        };

        var setupTypeNumber = function(test) {

          var bits = QRUtil.getBCHTypeNumber(_typeNumber);

          for (var i = 0; i < 18; i += 1) {
            var mod = (!test && ( (bits >> i) & 1) == 1);
            _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
          }

          for (var i = 0; i < 18; i += 1) {
            var mod = (!test && ( (bits >> i) & 1) == 1);
            _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
          }
        };

        var setupTypeInfo = function(test, maskPattern) {

          var data = (_errorCorrectionLevel << 3) | maskPattern;
          var bits = QRUtil.getBCHTypeInfo(data);

          // vertical
          for (var i = 0; i < 15; i += 1) {

            var mod = (!test && ( (bits >> i) & 1) == 1);

            if (i < 6) {
              _modules[i][8] = mod;
            } else if (i < 8) {
              _modules[i + 1][8] = mod;
            } else {
              _modules[_moduleCount - 15 + i][8] = mod;
            }
          }

          // horizontal
          for (var i = 0; i < 15; i += 1) {

            var mod = (!test && ( (bits >> i) & 1) == 1);

            if (i < 8) {
              _modules[8][_moduleCount - i - 1] = mod;
            } else if (i < 9) {
              _modules[8][15 - i - 1 + 1] = mod;
            } else {
              _modules[8][15 - i - 1] = mod;
            }
          }

          // fixed module
          _modules[_moduleCount - 8][8] = (!test);
        };

        var mapData = function(data, maskPattern) {

          var inc = -1;

            return c - 0x61 + 26;
          } else if (0x30 <= c && c <= 0x39) {
            return c - 0x30 + 52;
          } else if (c == 0x2b) {
            return 62;
          } else if (c == 0x2f) {
            return 63;
          } else {
            throw 'c:' + c;
          }
        };

        return _this;
      };

      //---------------------------------------------------------------------
      // gifImage (B/W)
      //---------------------------------------------------------------------

      var gifImage = function(width, height) {

        var _width = width;
        var _height = height;
        var _data = new Array(width * height);

        var _this = {};

        _this.setPixel = function(x, y, pixel) {
          _data[y * _width + x] = pixel;
        };

        _this.write = function(out) {

          //---------------------------------
          // GIF Signature

          out.writeString('GIF87a');

          //---------------------------------
          // Screen Descriptor

          out.writeShort(_width);
          out.writeShort(_height);

          out.writeByte(0x80); // 2bit
          out.writeByte(0);
          out.writeByte(0);

          //---------------------------------
          // Global Color Map

          // black
          out.writeByte(0x00);
          out.writeByte(0x00);
          out.writeByte(0x00);

          // white
          out.writeByte(0xff);
          out.writeByte(0xff);
          out.writeByte(0xff);

          //---------------------------------
          // Image Descriptor

          out.writeString(',');
          out.writeShort(0);
          out.writeShort(0);
          out.writeShort(_width);
          out.writeShort(_height);
          out.writeByte(0);

          //---------------------------------
          // Local Color Map

          //---------------------------------
          // Raster Data

          var lzwMinCodeSize = 2;
          var raster = getLZWRaster(lzwMinCodeSize);

          out.writeByte(lzwMinCodeSize);

          var offset = 0;

          while (raster.length - offset > 255) {
            out.writeByte(255);
            out.writeBytes(raster, offset, 255);
            offset += 255;
          }

          out.writeByte(raster.length - offset);
          out.writeBytes(raster, offset, raster.length - offset);
          out.writeByte(0x00);

          //---------------------------------
          // GIF Terminator
          out.writeString(';');
        };

        var bitOutputStream = function(out) {

          var _out = out;
          var _bitLength = 0;
          var _bitBuffer = 0;

          var _this = {};

          _this.write = function(data, length) {

            if ( (data >>> length) != 0) {
              throw 'length over';
            }

            while (_bitLength + length >= 8) {
              _out.writeByte(0xff & ( (data << _bitLength) | _bitBuffer) );
              length -= (8 - _bitLength);
              data >>>= (8 - _bitLength);
              _bitBuffer = 0;
              _bitLength = 0;
            }

            _bitBuffer = (data << _bitLength) | _bitBuffer;
            _bitLength = _bitLength + length;
          };

          _this.flush = function() {
            if (_bitLength > 0) {
              _out.writeByte(_bitBuffer);
            }
          };

          return _this;
        };

        var getLZWRaster = function(lzwMinCodeSize) {

          var clearCode = 1 << lzwMinCodeSize;
          var endCode = (1 << lzwMinCodeSize) + 1;
          var bitLength = lzwMinCodeSize + 1;

          // Setup LZWTable
          var table = lzwTable();

          for (var i = 0; i < clearCode; i += 1) {
            table.add(String.fromCharCode(i) );
          }
          table.add(String.fromCharCode(clearCode) );
          table.add(String.fromCharCode(endCode) );

          var byteOut = byteArrayOutputStream();
          var bitOut = bitOutputStream(byteOut);

          // clear code
          bitOut.write(clearCode, bitLength);

          var dataIndex = 0;

          var s = String.fromCharCode(_data[dataIndex]);
          dataIndex += 1;

          while (dataIndex < _data.length) {

            var c = String.fromCharCode(_data[dataIndex]);
            dataIndex += 1;

            if (table.contains(s + c) ) {

              s = s + c;

            } else {

              bitOut.write(table.indexOf(s), bitLength);

              if (table.size() < 0xfff) {

                if (table.size() == (1 << bitLength) ) {
                  bitLength += 1;
                }

                table.add(s + c);
              }

              s = c;
            }
          }

          bitOut.write(table.indexOf(s), bitLength);

          // end code
          bitOut.write(endCode, bitLength);

          bitOut.flush();

          return byteOut.toByteArray();
        };

        var lzwTable = function() {

          var _map = {};
          var _size = 0;

          var _this = {};

          _this.add = function(key) {
            if (_this.contains(key) ) {
              throw 'dup key:' + key;
            }
            _map[key] = _size;
            _size += 1;
          };

          _this.size = function() {
            return _size;
          };

          _this.indexOf = function(key) {
            return _map[key];
          };

          _this.contains = function(key) {
            return typeof _map[key] != 'undefined';
          };

          return _this;
        };

        return _this;
      };

      var createDataURL = function(width, height, getPixel) {
        var gif = gifImage(width, height);
        for (var y = 0; y < height; y += 1) {
          for (var x = 0; x < width; x += 1) {
            gif.setPixel(x, y, getPixel(x, y) );
          }
        }

        var b = byteArrayOutputStream();
        gif.write(b);

        var base64 = base64EncodeOutputStream();
        var bytes = b.toByteArray();
        for (var i = 0; i < bytes.length; i += 1) {
          base64.writeByte(bytes[i]);
        }
        base64.flush();

        return 'data:image/gif;base64,' + base64;
      };

      //---------------------------------------------------------------------
      // returns qrcode function.

      return qrcode;
    }();

    // multibyte support
    !function() {

      qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
        // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
        function toUTF8Array(str) {
          var utf8 = [];
          for (var i=0; i < str.length; i++) {
            var charcode = str.charCodeAt(i);
            if (charcode < 0x80) utf8.push(charcode);
            else if (charcode < 0x800) {
              utf8.push(0xc0 | (charcode >> 6),
                  0x80 | (charcode & 0x3f));
            }
            else if (charcode < 0xd800 || charcode >= 0xe000) {
              utf8.push(0xe0 | (charcode >> 12),
                  0x80 | ((charcode>>6) & 0x3f),
                  0x80 | (charcode & 0x3f));
            }
            // surrogate pair
            else {
              i++;
              // UTF-16 encodes 0x10000-0x10FFFF by
              // subtracting 0x10000 and splitting the
              // 20 bits of 0x0-0xFFFFF into two halves
              charcode = 0x10000 + (((charcode & 0x3ff)<<10)
                | (str.charCodeAt(i) & 0x3ff));
              utf8.push(0xf0 | (charcode >>18),
                  0x80 | ((charcode>>12) & 0x3f),
                  0x80 | ((charcode>>6) & 0x3f),
                  0x80 | (charcode & 0x3f));
            }
          }
          return utf8;
        }
        return toUTF8Array(s);
      };

    async function startQRPairing() {
      // El codigo lo genera el SERVIDOR (8 caracteres, alfabeto sin O/0 ni
      // I/1). Antes salia de Math.random() en el cliente, que no es
      // criptograficamente seguro, y el player insertaba en device_pairings.
      dlog('Generando código de vinculación: ' + qrCode, 'info')

      try {
        // Supabase v1 requiere un ARRAY para .insert()
        var res = await sb.rpc('create_pairing_code', {})
        if (!res.error && !res.data) throw new Error('el servidor no devolvio codigo')
        if (!res.error) qrCode = res.data
        if (res.error) throw new Error(res.error.message)
        dlog('Código registrado en Supabase OK', 'ok')
      } catch(e) {
        dlog('Error creando código en DB: ' + e.message, 'err')
        document.getElementById('qr-loading').textContent = 'Error de conexión: ' + e.message
        return
      }

      var pairUrl = PAIR_BASE_URL + '/pair?code=' + qrCode
      dlog('QR URL: ' + pairUrl, 'info')
      // QR generado en el propio dispositivo, sin salir a la red. typeNumber
      // 0 = automatico segun la longitud; 'M' = la misma correccion de errores
      // que se pedia antes. createDataURL devuelve un GIF en base64.
      try {
        var qr = qrcode(0, 'M')
        qr.addData(pairUrl)
        qr.make()
        document.getElementById('qr-img').src = qr.createDataURL(4, 8)
      } catch(eq) {
        dlog('Error generando el QR: ' + eq.message, 'err')
        document.getElementById('qr-loading').textContent = 'Error generando el QR'
        return
      }
      document.getElementById('qr-loading').style.display = 'none'
      document.getElementById('qr-ready').style.display   = 'block'

      qrInterval = setInterval(async function() {
        try {
          // Supabase v1 .single() funciona similar
          // La RPC devuelve el token Y borra la fila en la misma transaccion:
          // sin ventana en la que quede visible en la tabla. Mientras no se
          // vincule devuelve null y no borra nada.
          var r = await sb.rpc('claim_pairing_token', { p_code: qrCode })
          if (r.data) {
            clearInterval(qrInterval)
            var token = r.data
            dlog('¡Vínculo detectado! Token recibido.', 'ok')

            // Limpieza (opcional, v1 usa delete con match)

            document.getElementById('qr-status').textContent = '✅ ¡Conectado! Arrancando...'
            document.getElementById('qr-status').style.color = '#10B981'
            lsSet('device_token', token)
            setTimeout(function() {
              document.getElementById('token-screen').style.display = 'none'
              document.getElementById('screen').style.display = 'block'
              startPlayer(token)
            }, 1200)
          }
        } catch(e) {
          // Error silencioso en polling para no saturar el log si es fallo de red temporal
        }
      }, 3000)
    }

    init()
</script>
